<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style type="text/css">
        @media only screen and (max-width: 620px) {
            .email-body { padding: 20px 16px !important; }
            .email-card { padding: 28px 20px !important; }
            .btn-action { width: 100% !important; text-align: center !important; display: block !important; box-sizing: border-box !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; width: 100%; background-color: #f4f6f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1a2420;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f6f5;">
        <tr>
            <td align="center" class="email-body" style="padding: 40px 20px;">
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin: 0 auto;">

                    <!-- Logo / Brand -->
                    <tr>
                        <td style="padding: 0 0 28px 0; text-align: center; font-size: 18px; font-weight: 700;">
                            <a href="{{ panel_url }}" target="_blank"
                               style="color: #0d9488; text-decoration: none; letter-spacing: 0.02em;">
                                {{ panel_name }}
                            </a>
                        </td>
                    </tr>

                    <!-- Card -->
                    <tr>
                        <td class="email-card"
                            style="background-color: #ffffff; border: 1px solid #e2e8e6; border-radius: 12px; padding: 36px 32px;">

                            <!-- Greeting -->
                            <h1 style="margin: 0 0 20px 0; font-size: 20px; font-weight: 600; color: #1a2420; line-height: 1.3;">
                                {{ greeting }}
                            </h1>

                            <!-- Main Content -->
                            <div style="font-size: 14px; line-height: 1.7; color: #4a5c56; margin-bottom: 8px;">
                                {{ main_content|safe }}
                            </div>

                            <!-- Action Button -->
                            {% if action_url and action_text %}
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin: 28px 0 24px 0;">
                                <tr>
                                    <td align="center">
                                        <a href="{{ action_url }}" target="_blank" class="btn-action"
                                           style="display: inline-block; padding: 12px 32px; background-color: #14b8a6; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 8px; letter-spacing: 0.02em;">
                                            {{ action_text }}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            {% endif %}

                            <!-- Salutation -->
                            <p style="margin: 20px 0 0 0; font-size: 14px; color: #4a5c56; line-height: 1.6;">
                                — {{ panel_name }} 运维组
                            </p>

                            <!-- Sub Copy -->
                            {% if action_url and action_text %}
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin-top: 28px; padding-top: 20px; border-top: 1px solid #e8ece9;">
                                <tr>
                                    <td>
                                        <p style="margin: 0 0 4px 0; font-size: 11px; color: #8a9c96; line-height: 1.5;">
                                            如果按钮无法点击，请复制以下链接到浏览器地址栏：
                                        </p>
                                        <p style="margin: 0; font-size: 11px; line-height: 1.5; word-break: break-all;">
                                            <a href="{{ action_url }}" target="_blank" style="color: #0d9488; text-decoration: underline;">{{ action_url }}</a>
                                        </p>
                                    </td>
                                </tr>
                            </table>
                            {% endif %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 24px 0 0 0; text-align: center;">
                            <p style="margin: 0; font-size: 11px; color: #8a9c96; line-height: 1.5;">
                                &copy; {{ current_year }}
                                <a href="{{ panel_url }}" target="_blank" style="color: #8a9c96; text-decoration: none;">{{ panel_name }}</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
