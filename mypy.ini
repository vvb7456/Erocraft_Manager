[mypy]
python_version = 3.12
namespace_packages = true
explicit_package_bases = true

# --- 宽松起步：检查有标注的函数，但不强制全标注 ---
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --- Any 策略：允许 Any 出现，但不静默传播到返回值 ---
warn_return_any = false
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true

# --- 严格性：先关闭，后续逐步开启 ---
strict = false
strict_optional = true

# --- Pydantic v2 mypy 插件 ---
plugins = pydantic.mypy

# --- 第三方库无 stub：忽略 ---
ignore_missing_imports = true

# --- 输出 ---
show_error_codes = true
pretty = true

# --- 排除：非运行时代码、迁移、测试 ---
exclude = (?x)(
    ^alembic/versions/|
    ^app/scripts/|
    ^build/|
    ^scripts/|
    ^tests/|
    ^venv/
  )

# --- 第三方库精确忽略 ---
[mypy-slowapi.*]
ignore_missing_imports = true

[mypy-aiomysql.*]
ignore_missing_imports = true

[mypy-apscheduler.*]
ignore_missing_imports = true

[mypy-aiosmtplib.*]
ignore_missing_imports = true

[mypy-websockets.*]
ignore_missing_imports = true

[mypy-alembic.*]
ignore_missing_imports = true

[mypy-itsdangerous.*]
ignore_missing_imports = true
