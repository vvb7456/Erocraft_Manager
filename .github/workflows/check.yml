name: check

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      - name: install dev deps
        run: pip install mypy types-requests types-PyYAML types-psutil

      - name: compile check
        run: python -m compileall -q app agent

      - name: 检查共用接口契约
        run: python scripts/generate-contracts.py --check

      - name: ruff (fatal only)
        run: |
          pip install ruff
          ruff check app agent --select=E9,F63,F7,F82

      - name: mypy
        run: mypy app agent

  agent-python38:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: 安装 Agent 依赖
        run: pip install -r agent/requirements.txt

      - name: 检查 Python 3.8 契约兼容性
        run: python scripts/check-agent-contracts.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: type check
        run: npx vue-tsc --noEmit

      - name: i18n check
        run: npm run check:i18n

      - name: build
        run: npx vite build
