name: check

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      - name: compile check
        run: python -m compileall -q app agent

      - name: ruff (fatal only)
        run: |
          pip install ruff
          ruff check app agent --select=E9,F63,F7,F82

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: type check
        run: npx vue-tsc --noEmit

      - name: i18n check
        run: npm run check:i18n

      - name: build
        run: npx vite build
