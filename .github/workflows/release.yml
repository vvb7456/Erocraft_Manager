name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: resolve tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="main-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      # -------- frontend --------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: frontend deps
        run: npm ci
        working-directory: frontend

      - name: frontend build
        run: npx vite build
        working-directory: frontend

      - name: pack frontend-dist
        run: |
          echo "${{ steps.meta.outputs.sha }}" > static/dist/.version
          tar -C static/dist -czf "frontend-dist-${{ steps.meta.outputs.tag }}.tar.gz" .

      # -------- backend (manager) --------
      - name: pack manager-backend
        run: |
          tar -czf "manager-backend-${{ steps.meta.outputs.tag }}.tar.gz" \
            --transform "s,^,manager-backend/," \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            app alembic alembic.ini requirements.txt templates scripts

      # -------- agent --------
      - name: pack agent
        run: |
          # 排除运行时配置（保留 *.example.yaml）
          tar -czf "agent-${{ steps.meta.outputs.tag }}.tar.gz" \
            -C agent \
            --exclude='agent.yaml' \
            --exclude='config.yaml' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .

      - name: list artifacts
        run: ls -lah *.tar.gz

      # -------- release --------
      - name: create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            frontend-dist-*.tar.gz
            manager-backend-*.tar.gz
            agent-*.tar.gz
